<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Интимный Календарь</title>

    <!-- PWA & iOS Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Календарь">
    <meta name="theme-color" content="#0f0d13">

    <!-- Firebase SDK (Realtime Sync) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0d13;
            --card-bg: #181420;
            --card-hover: #231c30;
            --accent-gold: #e2b07e;
            --accent-rose: #e67e90;
            --accent-purple: #a374db;
            --text-main: #f5f0fa;
            --text-sub: #a89fbe;
            --border: rgba(226, 176, 126, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: calc(20px + env(safe-area-inset-top)) 15px calc(50px + env(safe-area-inset-bottom)) 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        header { text-align: center; max-width: 700px; margin-bottom: 15px; }
        h1 { color: var(--accent-gold); font-size: 1.8rem; margin: 0 0 4px 0; }
        .month-title { color: var(--accent-rose); font-size: 1rem; font-weight: 600; margin-bottom: 8px; text-transform: capitalize; }

        .sync-badge {
            background: rgba(230, 126, 144, 0.15);
            border: 1px solid var(--accent-rose);
            color: var(--accent-rose);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .setup-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
        .form-row { display: flex; gap: 10px; }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #0d0a12;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold), #c48c56);
            border: none;
            border-radius: 10px;
            color: #0f0d13;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .progress-bar-container { flex: 1; min-width: 200px; }
        .progress-text { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
        .progress-bar { height: 8px; background: #0d0a12; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent-gold); transition: width 0.3s; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 900px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 120px;
            position: relative;
        }
        .day-card.completed { border-color: #4caf50; opacity: 0.75; }
        .day-card.completed::after { content: '✓'; position: absolute; top: 8px; right: 10px; color: #4caf50; font-weight: bold; }

        .day-number { font-size: 1.3rem; font-weight: 700; color: var(--accent-gold); }
        .day-category { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; margin-top: 4px; }
        .day-role { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; margin-top: 6px; font-weight: 600; }

        .role-m { background: rgba(230, 126, 144, 0.15); color: var(--accent-rose); }
        .role-f { background: rgba(163, 116, 219, 0.15); color: var(--accent-purple); }
        .role-both { background: rgba(226, 176, 126, 0.15); color: var(--accent-gold); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 6, 10, 0.92); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg); border: 1px solid var(--accent-gold);
            border-radius: 20px; padding: 25px; max-width: 480px; width: 100%;
            max-height: 85vh; overflow-y: auto; position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-sub); font-size: 1.8rem; cursor: pointer; }
        .modal-img-container { width: 100%; height: 200px; border-radius: 14px; margin: 15px 0; overflow: hidden; border: 1px solid var(--border); }
        .modal-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .video-link { display: inline-block; margin-top: 12px; color: var(--accent-gold); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Чувственный Календарь</h1>
        <div class="month-title" id="monthTitle"></div>
        <div class="sync-badge" id="syncBadge">📲 Синхронизация: Локальный режим</div>
    </header>

    <div class="setup-card" id="setupCard">
        <h2>✨ Настройка пары и Синхронизация</h2>
        <div class="form-group">
            <label>Общий Код Пара (одинаковый на обоих телефонах):</label>
            <input type="text" class="form-control" placeholder="Например: LOVE2026" id="pairCodeInput">
        </div>
        <div class="form-group">
            <label>Основной акцент на месяц:</label>
            <select class="form-control" id="preferenceSelect">
                <option value="female_lead">Женское Доминирование (Она Ведёт)</option>
                <option value="balanced">Микс (Разнообразие всех направлений)</option>
                <option value="kamasutra">Камасутра и Позы</option>
                <option value="bdsm">BDSM и Контроль</option>
                <option value="classic">Классика и Нежность</option>
            </select>
        </div>
        <button class="btn-primary" onclick="saveSettings()">Подключить и Запустить 🔥</button>
    </div>

    <div class="dashboard" id="dashboard" style="display:none;">
        <div class="progress-bar-container">
            <div class="progress-text" id="progressText"></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <button class="btn-primary" style="width:auto; padding: 8px 15px; margin:0; font-size:0.8rem;" onclick="resetSettings()">Настройки</button>
    </div>

    <div class="calendar-grid" id="grid"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle" style="color:var(--accent-gold); margin-top:0;"></h3>
            <div id="modalRole" style="font-size:0.85rem; margin-bottom:10px;"></div>
            <div class="modal-img-container">
                <img id="modalImg" src="" alt="Иллюстрация">
            </div>
            <p id="modalTask" style="line-height:1.6; font-size:0.95rem;"></p>
            <div id="modalTip" style="font-style:italic; color:var(--text-sub); font-size:0.85rem; background:rgba(255,255,255,0.03); padding:10px; border-left:3px solid var(--accent-gold);"></div>
            <a id="modalVideo" class="video-link" href="#" target="_blank">🎬 Обучающий материал / гайд</a>
            <button class="btn-primary" style="margin-top:20px;" onclick="toggleComplete()">Отметить пройденным ✓</button>
        </div>
    </div>

    <script>
        // Конфигурация публичной БД для синхронизации
        const firebaseConfig = {
            databaseURL: "https://calendar-pair-default-rtdb.europe-west1.firebasedatabase.app"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) { console.log("Синхронизация в автономном режиме"); }

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const monthKey = `${currentYear}_${currentMonth}`;

        document.getElementById('monthTitle').innerText = `${monthNames[currentMonth]} ${currentYear} (${daysInCurrentMonth} дней)`;

        const imgPool = [
            "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=800&q=80"
        ];

        const database = {
            female_lead: [
                { title: "Классическая Наездница", category: "Доминирование", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", task: "Он лежит на спине. Девушка сверху задает глубокий ритм, контролируя скорость и угол фрикций.", tip: "Совет: Делайте паузы на пике его возбуждения.", video: "https://www.youtube.com/results?search_query=cowgirl+position+guide" },
                { title: "Запрет на Оргазм (Orgasm Denial)", category: "BDSM", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", task: "Она доводит его до края разрядки 3 раза и резко останавливает ласки по команде. Финиш только с её разрешения.", tip: "Совет: Используйте прямой зрительный контакт.", video: "https://www.youtube.com/results?search_query=edging+and+denial+guide" },
                { title: "Управление Руками Партнера", category: "Доминирование", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", task: "Она берет его запястья и сама двигает его руками по своему телу, задавая силу сжатия.", tip: "Совет: Ему запрещено проявление инициативы без команды.", video: "https://www.youtube.com/results?search_query=guided+touch+intimacy" }
            ],
            kamasutra: [
                { title: "Поза 'Раковина'", category: "Камасутра", lead: "🤝 Оба на равных", task: "Девушка на спине с ногами на его плечах. Максимально глубокое проникновение.", tip: "Совет: Движения короткие и ритмичные.", video: "https://www.youtube.com/results?search_query=kamasutra+sankha+pose" },
                { title: "Поза 'Бабочка'", category: "Камасутра", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", task: "Партнерша на краю высокой кровати, Он стоит перед ней. Удобный угол для ласк.", tip: "Совет: Подложите подушку под поясницу.", video: "https://www.youtube.com/results?search_query=butterfly+kamasutra" }
            ],
            bdsm: [
                { title: "Шелковая Фиксация", category: "BDSM", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", task: "Руки зафиксированы над головой шелковым шарфом. Медленные ласки всего тела.", tip: "Совет: Используйте перышко и поцелуи.", video: "https://www.youtube.com/results?search_query=silk+bondage+tutorial" },
                { title: "Маска и Изоляция", category: "BDSM", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", task: "Полная изоляция слуха и зрения. Ведущая производит неожиданные касания.", tip: "Совет: Контраст льда и горячего дыхания.", video: "https://www.youtube.com/results?search_query=sensory+deprivation+bdsm" }
            ],
            classic: [
                { title: "Техника CAT", category: "Классика", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", task: "Миссионерская поза со смещением корпуса вверх. Трение основанием члена о клитор.", tip: "Совет: Нажимайте плавно и ритмично.", video: "https://www.youtube.com/results?search_query=coital+alignment+technique" },
                { title: "Правило 20 минут", category: "Классика", lead: "🤝 Оба на равных", task: "20 минут поцелуев и массажа бедер без касания гениталий.", tip: "Совет: Создает сильный голод к контакту.", video: "https://www.youtube.com/results?search_query=foreplay+guide+couples" }
            ]
        };

        function getTasksForMonth(category) {
            let pool = database[category] || database.female_lead;
            const result = [];
            for (let day = 1; day <= daysInCurrentMonth; day++) {
                const base = pool[(day - 1) % pool.length];
                result.push({
                    day: day,
                    title: `${day < 10 ? '0' + day : day}. ${base.title}`,
                    category: base.category,
                    lead: base.lead,
                    roleClass: base.lead.includes("Она — Ведущая") ? "role-f" : (base.lead.includes("Он — Ведущий") ? "role-m" : "role-both"),
                    img: imgPool[(day - 1) % imgPool.length],
                    task: base.task,
                    tip: base.tip,
                    video: base.video
                });
            }
            return result;
        }

        let pairCode = localStorage.getItem('pairCode') || '';
        let selectedCategory = localStorage.getItem('userCat') || 'female_lead';
        let monthTasks = getTasksForMonth(selectedCategory);
        let completedDays = JSON.parse(localStorage.getItem(`completed_${monthKey}`) || '[]');
        let currentDay = null;

        if (pairCode) {
            document.getElementById('pairCodeInput').value = pairCode;
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            initSync();
            renderGrid();
        }

        function saveSettings() {
            pairCode = document.getElementById('pairCodeInput').value.trim().toUpperCase() || 'PAIR123';
            selectedCategory = document.getElementById('preferenceSelect').value;
            
            localStorage.setItem('pairCode', pairCode);
            localStorage.setItem('userCat', selectedCategory);
            
            monthTasks = getTasksForMonth(selectedCategory);
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            
            initSync();
            renderGrid();
        }

        function resetSettings() {
            document.getElementById('setupCard').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        // Подключение синхронизации между смартфонами
        function initSync() {
            if (!db || !pairCode) return;
            document.getElementById('syncBadge').innerText = `🟢 Синхронно: Код [ ${pairCode} ]`;
            
            // Слушаем изменения партнерского телефона в реальном времени
            db.ref(`pairs/${pairCode}/${monthKey}`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    completedDays = data;
                    localStorage.setItem(`completed_${monthKey}`, JSON.stringify(completedDays));
                    renderGrid();
                }
            });
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            monthTasks.forEach(task => {
                const isCompleted = completedDays.includes(task.day);
                const card = document.createElement('div');
                card.className = `day-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="day-number">${task.day < 10 ? '0' + task.day : task.day}</div>
                    <div class="day-category">${task.category}</div>
                    <div class="day-role ${task.roleClass}">${task.lead.split(' ')[1]}</div>
                `;
                card.onclick = () => openModal(task);
                grid.appendChild(card);
            });
            updateProgress();
        }

        function openModal(task) {
            currentDay = task.day;
            document.getElementById('modalTitle').innerText = task.title;
            document.getElementById('modalRole').innerText = task.lead;
            document.getElementById('modalImg').src = task.img;
            document.getElementById('modalTask').innerText = task.task;
            document.getElementById('modalTip').innerText = task.tip;
            document.getElementById('modalVideo').href = task.video;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function toggleComplete() {
            if (completedDays.includes(currentDay)) {
                completedDays = completedDays.filter(d => d !== currentDay);
            } else {
                completedDays.push(currentDay);
            }
            
            // Локальное сохранение
            localStorage.setItem(`completed_${monthKey}`, JSON.stringify(completedDays));
            
            // Облачная отправка на телефон партнера
            if (db && pairCode) {
                db.ref(`pairs/${pairCode}/${monthKey}`).set(completedDays);
            }
            
            renderGrid();
            closeModal();
        }

        function updateProgress() {
            const count = completedDays.length;
            document.getElementById('progressText').innerText = `Прогресс пары: ${count} / ${daysInCurrentMonth} дней`;
            document.getElementById('progressFill').style.width = `${(count / daysInCurrentMonth) * 100}%`;
        }
    </script>
</body>
</html>
