<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Интимный Календарь</title>

    <!-- PWA & iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Календарь">
    <meta name="theme-color" content="#0f0d13">

    <!-- Web App Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121016'/><text y='65' x='50' font-size='50' text-anchor='middle'>🔥</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🔥</text></svg>">

    <!-- Manifest -->
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%D0%98%D0%BD%D1%82%D0%B8%D0%BC%D0%BD%D1%8B%D0%B9%20%D0%9A%D0%B0%D0%BB%D0%B5%D0%BD%D0%B4%D0%B0%D1%80%D1%8C%22%2C%22short_name%22%3A%22%D0%9A%D0%B0%D0%BB%D0%B5%D0%BD%D0%B4%D0%B0%D1%80%D1%8C%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f0d13%22%2C%22theme_color%22%3A%22%230f0d13%22%7D">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0d13;
            --card-bg: #181420;
            --card-hover: #231c30;
            --accent-gold: #e2b07e;
            --accent-rose: #e67e90;
            --accent-purple: #a374db;
            --text-main: #f5f0fa;
            --text-sub: #a89fbe;
            --border: rgba(226, 176, 126, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: calc(20px + env(safe-area-inset-top)) 15px calc(50px + env(safe-area-inset-bottom)) 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        header { text-align: center; max-width: 700px; margin-bottom: 15px; }
        h1 { color: var(--accent-gold); font-size: 1.8rem; margin: 0 0 4px 0; }
        .month-title { color: var(--accent-rose); font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; text-transform: capitalize; }
        p.subtitle { color: var(--text-sub); font-size: 0.85rem; line-height: 1.4; margin: 0; }

        .install-guide {
            background: linear-gradient(135deg, rgba(24, 20, 32, 0.9), rgba(35, 28, 48, 0.9));
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 15px 18px;
            margin-bottom: 20px;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .install-guide h3 { margin: 0 0 8px 0; font-size: 1rem; color: var(--accent-gold); }
        .install-steps { font-size: 0.8rem; line-height: 1.5; color: var(--text-main); margin: 0; padding-left: 18px; }
        .hide-guide-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }

        .setup-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
        .form-row { display: flex; gap: 10px; }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #0d0a12;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold), #c48c56);
            border: none;
            border-radius: 10px;
            color: #0f0d13;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .progress-bar-container { flex: 1; min-width: 200px; }
        .progress-text { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
        .progress-bar { height: 8px; background: #0d0a12; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent-gold); transition: width 0.3s; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 900px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 120px;
            position: relative;
        }
        .day-card.completed { border-color: #4caf50; opacity: 0.75; }
        .day-card.completed::after { content: '✓'; position: absolute; top: 8px; right: 10px; color: #4caf50; font-weight: bold; }

        .day-number { font-size: 1.3rem; font-weight: 700; color: var(--accent-gold); }
        .day-category { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; margin-top: 4px; }
        .day-role { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; margin-top: 6px; font-weight: 600; }

        .role-m { background: rgba(230, 126, 144, 0.15); color: var(--accent-rose); }
        .role-f { background: rgba(163, 116, 219, 0.15); color: var(--accent-purple); }
        .role-both { background: rgba(226, 176, 126, 0.15); color: var(--accent-gold); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 6, 10, 0.92); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg); border: 1px solid var(--accent-gold);
            border-radius: 20px; padding: 25px; max-width: 480px; width: 100%;
            max-height: 85vh; overflow-y: auto; position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-sub); font-size: 1.8rem; cursor: pointer; }
        .modal-img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin: 15px 0; border: 1px solid var(--border); }
        .video-link { display: inline-block; margin-top: 12px; color: var(--accent-gold); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Чувственный Календарь</h1>
        <div class="month-title" id="monthTitle">Август 2026</div>
        <p class="subtitle">Персональная программа на текущий месяц</p>
    </header>

    <div class="install-guide" id="installGuide">
        <button class="hide-guide-btn" onclick="dismissGuide()">&times;</button>
        <h3>📱 Установите как приложение:</h3>
        <ol class="install-steps" id="installSteps"></ol>
    </div>

    <div class="setup-card" id="setupCard">
        <h2>✨ Настройка пары</h2>
        <div class="form-row">
            <div class="form-group" style="flex:1">
                <label>Рост (М / Ж)</label>
                <input type="text" class="form-control" placeholder="180 / 168" id="heightInput">
            </div>
            <div class="form-group" style="flex:1">
                <label>Вес (М / Ж)</label>
                <input type="text" class="form-control" placeholder="80 / 58" id="weightInput">
            </div>
        </div>
        <div class="form-group">
            <label>Основной акцент пары:</label>
            <select class="form-control" id="preferenceSelect">
                <option value="balanced">Баланс: Классика + Камасутра + BDSM</option>
                <option value="classic">Максимум Классики и Чувств</option>
                <option value="kamasutra">Акробатика и Камасутра</option>
                <option value="bdsm">Психология и Контроль (BDSM)</option>
            </select>
        </div>
        <button class="btn-primary" onclick="saveSettings()">Сформировать на этот месяц 🔥</button>
    </div>

    <div class="dashboard" id="dashboard" style="display:none;">
        <div class="progress-bar-container">
            <div class="progress-text" id="progressText">Прогресс: 0 / 31 дней</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <button class="btn-primary" style="width:auto; padding: 8px 15px; margin:0; font-size:0.8rem;" onclick="resetProgress()">Сброс</button>
    </div>

    <div class="calendar-grid" id="grid"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle" style="color:var(--accent-gold); margin-top:0;"></h3>
            <div id="modalRole" style="font-size:0.85rem; margin-bottom:10px;"></div>
            <img id="modalImg" class="modal-img" src="" alt="Иллюстрация">
            <p id="modalTask" style="line-height:1.6; font-size:0.95rem;"></p>
            <div id="modalTip" style="font-style:italic; color:var(--text-sub); font-size:0.85rem; background:rgba(255,255,255,0.03); padding:10px; border-left:3px solid var(--accent-gold);"></div>
            <a id="modalVideo" class="video-link" href="#" target="_blank">🎬 Смотреть обучающий гайд</a>
            <button class="btn-primary" style="margin-top:20px;" onclick="toggleComplete()">Отметить пройденным ✓</button>
        </div>
    </div>

    <script>
        // Работа с датами
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth(); // 0-11
        
        // Автоматически определяем количество дней в текущем месяце
        const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const monthKey = `${currentYear}_${currentMonth}`; // Ключ для хранения прогресса текущего месяца

        document.getElementById('monthTitle').innerText = `${monthNames[currentMonth]} ${currentYear} (${daysInCurrentMonth} дней)`;

        // PWA Инструкция
        const stepsContainer = document.getElementById('installSteps');
        const guideBlock = document.getElementById('installGuide');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

        if (isStandalone || localStorage.getItem('hideGuide') === 'true') {
            guideBlock.style.display = 'none';
        } else if (isIOS) {
            stepsContainer.innerHTML = `
                <li>Нажмите <b>«Поделиться»</b> (квадрат со стрелкой в Safari).</li>
                <li>Выберите <b>«На экран "Домой"»</b> и нажмите <b>«Добавить»</b>.</li>
            `;
        } else {
            stepsContainer.innerHTML = `
                <li>Нажмите <b>меню (3 точки)</b> в браузере.</li>
                <li>Выберите <b>«Установить приложение»</b> или <b>«На экран "Домой"»</b>.</li>
            `;
        }

        function dismissGuide() {
            guideBlock.style.display = 'none';
            localStorage.setItem('hideGuide', 'true');
        }

        // Базовая база заданий
        const rawTasks = [
            { title: "Сенсорная пауза 🧊", category: "Сенсорика", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", roleClass: "role-m", img: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=600&q=80", task: "Он завязывает ей глаза и проводит 20-минутный контрастный массаж льдом и горячим маслом без касания паха.", tip: "Совет: Ей разрешено только чувствовать.", video: "https://www.youtube.com/results?search_query=sensate+focus+massage+tutorial" },
            { title: "Цветок Лотоса 🧘‍♀️", category: "Камасутра", lead: "🤝 Оба на равных", roleClass: "role-both", img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=600&q=80", task: "Он сидит скрестив ноги, Она садится сверху, обнимая за шею. Минимальные фрикции, глубокие поцелуи и синхронное дыхание.", tip: "Совет: Поза для глубокой эмоциональной связи.", video: "https://www.youtube.com/results?search_query=lotus+position+couples" },
            { title: "Контроль Финиша ⏳", category: "BDSM", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", roleClass: "role-f", img: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=600&q=80", task: "Она полностью управляет процессом. Он не имеет права кончать без разрешения. Используйте 3 остановки на самом пике (Edging).", tip: "Совет: Выдерживайте длительные паузы.", video: "https://www.youtube.com/results?search_query=edging+technique+guide" },
            { title: "Техника CAT 💋", category: "Классика", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", roleClass: "role-m", img: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=600&q=80", task: "Миссионерская поза, где Мужчина смещается чуть выше. Движения скользящие, создающие непрерывное трение о клитор.", tip: "Совет: Подушка под крестец улучшит угол.", video: "https://www.youtube.com/results?search_query=coital+alignment+technique" },
            { title: "Шелковая Фиксация 🎀", category: "BDSM", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", roleClass: "role-m", img: "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=600&q=80", task: "Нежная фиксация рук над головой шелковым шарфом. Полная отдача контроля и медленные ласки всего тела.", tip: "Совет: Действуйте плавно и нежно.", video: "https://www.youtube.com/results?search_query=soft+bondage+for+beginners" },
            { title: "Поза 'Раковина' 🌊", category: "Камасутра", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", roleClass: "role-f", img: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=600&q=80", task: "Она лежит на спине, закинув ноги на его плечи. Задавайте ритм движениями бедер и добавляйте стимуляцию пальцами.", tip: "Совет: Глубокий контакт и полный контроль темпа.", video: "https://www.youtube.com/results?search_query=kamasutra+positions+guide" },
            { title: "Экспресс-Страсть 🔥", category: "Классика", lead: "🤝 Оба на равных", roleClass: "role-both", img: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80", task: "Быстрый, спонтанный секс вне спальни (гостиная или ванная). Минимум длинных прелюдий, максимум страсти.", tip: "Совет: Выплесните накопленную за неделю энергию.", video: "https://www.youtube.com/results?search_query=spontaneous+intimacy+tips" }
        ];

        // Генератор под текущий месяц
        function generateMonthTasks() {
            const result = [];
            for (let day = 1; day <= daysInCurrentMonth; day++) {
                // Вычисляем индекс карточки на основе дня и месяца
                const index = (day + currentMonth * 3) % rawTasks.length;
                const base = rawTasks[index];
                result.push({
                    day: day,
                    title: `${day < 10 ? '0' + day : day}. ${base.title}`,
                    category: base.category,
                    lead: base.lead,
                    roleClass: base.roleClass,
                    img: base.img,
                    task: base.task,
                    tip: base.tip,
                    video: base.video
                });
            }
            return result;
        }

        const monthTasks = generateMonthTasks();

        // Загрузка прогресса именно для ЭТОГО месяца
        let completedDays = JSON.parse(localStorage.getItem(`completedDays_${monthKey}`) || '[]');
        let currentDay = null;

        function saveSettings() {
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            monthTasks.forEach(task => {
                const isCompleted = completedDays.includes(task.day);
                const card = document.createElement('div');
                card.className = `day-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="day-number">${task.day < 10 ? '0' + task.day : task.day}</div>
                    <div class="day-category">${task.category}</div>
                    <div class="day-role ${task.roleClass}">${task.lead.split(' ')[1]}</div>
                `;
                card.onclick = () => openModal(task);
                grid.appendChild(card);
            });
            updateProgress();
        }

        function openModal(task) {
            currentDay = task.day;
            document.getElementById('modalTitle').innerText = task.title;
            document.getElementById('modalRole').innerText = task.lead;
            document.getElementById('modalImg').src = task.img;
            document.getElementById('modalTask').innerText = task.task;
            document.getElementById('modalTip').innerText = task.tip;
            document.getElementById('modalVideo').href = task.video;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function toggleComplete() {
            if (completedDays.includes(currentDay)) {
                completedDays = completedDays.filter(d => d !== currentDay);
            } else {
                completedDays.push(currentDay);
            }
            localStorage.setItem(`completedDays_${monthKey}`, JSON.stringify(completedDays));
            renderGrid();
            closeModal();
        }

        function updateProgress() {
            const count = completedDays.length;
            document.getElementById('progressText').innerText = `Прогресс: ${count} / ${daysInCurrentMonth} дней`;
            document.getElementById('progressFill').style.width = `${(count / daysInCurrentMonth) * 100}%`;
        }

        function resetProgress() {
            if (confirm("Сбросить прогресс за текущий месяц?")) {
                completedDays = [];
                localStorage.removeItem(`completedDays_${monthKey}`);
                renderGrid();
            }
        }
    </script>
</body>
</html>
