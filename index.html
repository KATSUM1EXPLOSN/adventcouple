            color: #0f0d13;

            padding: 15px 20px;
            border-radius: 14px;

            align-items: center;
            justify-content: space-between;
            min-height: 120px;
            position: relative;

        // Генерация заданий без дубликатов на текущий месяц
        function getTasksForMonth(category) {
            let pool = [];
            if (category === 'balanced') {
                pool = [...database.classic, ...database.kamasutra, ...database.bdsm];
            } else {
                pool = database[category] || database.classic;
            }

            // Псевдослучайное перемешивание на основе года и месяца
            const shuffled = [...pool].sort((a, b) => {
                const hashA = (a.title.length * 17 + currentMonth * 31) % 100;
                const hashB = (b.title.length * 17 + currentMonth * 31) % 100;
                return hashA - hashB;
            });

            const result = [];
            for (let day = 1; day <= daysInCurrentMonth; day++) {
                const base = shuffled[(day - 1) % shuffled.length];
                result.push({
                    day: day,
                    title: `${day < 10 ? '0' + day : day}. ${base.title}`,
                    category: base.category,
                    lead: base.lead,
                    roleClass: base.roleClass,
                    img: base.img,
                    task: base.task,
                    tip: base.tip,
                    video: base.video
                });
            }
            return result;
        }

        let selectedCategory = localStorage.getItem('userCat') || 'balanced';
        let monthTasks = getTasksForMonth(selectedCategory);
        let completedDays = JSON.parse(localStorage.getItem(`completed_${monthKey}_${selectedCategory}`) || '[]');
        let currentDay = null;

        if (localStorage.getItem('userCat')) {
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            renderGrid();
        }

        function saveSettings() {
            selectedCategory = document.getElementById('preferenceSelect').value;
            localStorage.setItem('userCat', selectedCategory);
            monthTasks = getTasksForMonth(selectedCategory);
            completedDays = JSON.parse(localStorage.getItem(`completed_${monthKey}_${selectedCategory}`) || '[]');
            
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            renderGrid();
        }

        function resetSettings() {
            document.getElementById('setupCard').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('grid').innerHTML = '';
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            monthTasks.forEach(task => {
                const isCompleted = completedDays.includes(task.day);
                const card = document.createElement('div');
                card.className = `day-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="day-number">${task.day < 10 ? '0' + task.day : task.day}</div>
                    <div class="day-category">${task.category}</div>
                    <div class="day-role ${task.roleClass}">${task.lead.split(' ')[1]}</div>
                `;
                card.onclick = () => openModal(task);
                grid.appendChild(card);
            });
            updateProgress();
        }

        function openModal(task) {
            currentDay = task.day;
            document.getElementById('modalTitle').innerText = task.title;
            document.getElementById('modalRole').innerText = task.lead;
            document.getElementById('modalImg').src = task.img;
            document.getElementById('modalTask').innerText = task.task;
            document.getElementById('modalTip').innerText = task.tip;
            document.getElementById('modalVideo').href = task.video;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function toggleComplete() {
            if (completedDays.includes(currentDay)) {
                completedDays = completedDays.filter(d => d !== currentDay);
            } else {
                completedDays.push(currentDay);
            }
            localStorage.setItem(`completed_${monthKey}_${selectedCategory}`, JSON.stringify(completedDays));
            renderGrid();
            closeModal();
        }

        function updateProgress() {
            const count = completedDays.length;
            document.getElementById('progressText').innerText = `Прогресс: ${count} / ${daysInCurrentMonth} дней`;
            document.getElementById('progressFill').style.width = `${(count / daysInCurrentMonth) * 100}%`;
        }
