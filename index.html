<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Интимный Календарь</title>

    <!-- PWA & iOS Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Календарь">
    <meta name="theme-color" content="#0f0d13">

    <!-- Firebase SDK (Realtime Sync) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f0d13;
            --card-bg: #181420;
            --card-hover: #231c30;
            --accent-gold: #e2b07e;
            --accent-rose: #e67e90;
            --accent-purple: #a374db;
            --text-main: #f5f0fa;
            --text-sub: #a89fbe;
            --border: rgba(226, 176, 126, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: calc(20px + env(safe-area-inset-top)) 15px calc(50px + env(safe-area-inset-bottom)) 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        header { text-align: center; max-width: 700px; margin-bottom: 10px; }
        h1 { color: var(--accent-gold); font-size: 1.8rem; margin: 0 0 4px 0; }
        .month-title { color: var(--accent-rose); font-size: 1rem; font-weight: 600; margin-bottom: 8px; text-transform: capitalize; }

        .sync-badge {
            background: rgba(230, 126, 144, 0.15);
            border: 1px solid var(--accent-rose);
            color: var(--accent-rose);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .setup-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #0d0a12;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold), #c48c56);
            border: none;
            border-radius: 10px;
            color: #0f0d13;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
        }

        .btn-secondary {
            background: rgba(226, 176, 126, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .dash-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .dash-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .progress-bar-container { width: 100%; }
        .progress-text { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .progress-bar { height: 8px; background: #0d0a12; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-rose), var(--accent-gold)); transition: width 0.3s; }

        .achievement-badge {
            background: rgba(163, 116, 219, 0.2);
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            text-align: center;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 900px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 120px;
            position: relative;
            transition: transform 0.2s;
        }
        .day-card.completed { border-color: #4caf50; opacity: 0.75; }
        .day-card.completed::after { content: '✓'; position: absolute; top: 8px; right: 10px; color: #4caf50; font-weight: bold; }
        .day-card.fav::before { content: '⭐'; position: absolute; top: 8px; left: 10px; font-size: 0.8rem; }
        .day-card.highlight { transform: scale(1.08); border-color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold); }

        .day-number { font-size: 1.3rem; font-weight: 700; color: var(--accent-gold); }
        .day-category { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; margin-top: 4px; }
        .day-role { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; margin-top: 6px; font-weight: 600; }

        .role-m { background: rgba(230, 126, 144, 0.15); color: var(--accent-rose); }
        .role-f { background: rgba(163, 116, 219, 0.15); color: var(--accent-purple); }
        .role-both { background: rgba(226, 176, 126, 0.15); color: var(--accent-gold); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 6, 10, 0.92); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg); border: 1px solid var(--accent-gold);
            border-radius: 20px; padding: 25px; max-width: 480px; width: 100%;
            max-height: 85vh; overflow-y: auto; position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-sub); font-size: 1.8rem; cursor: pointer; }
        .fav-toggle-btn { position: absolute; top: 18px; right: 50px; background: none; border: none; font-size: 1.3rem; cursor: pointer; }
        .modal-img-container { width: 100%; height: 200px; border-radius: 14px; margin: 15px 0; overflow: hidden; border: 1px solid var(--border); }
        .modal-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .video-link { display: inline-block; margin-top: 12px; color: var(--accent-gold); text-decoration: none; font-size: 0.85rem; font-weight: 600; }

        /* Стиль для генератора совпадений */
        .vote-options { display: flex; gap: 8px; margin-top: 10px; }
        .btn-vote { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0d0a12; color: #fff; cursor: pointer; font-size: 0.8rem; }
        .btn-vote.selected { border-color: var(--accent-gold); background: rgba(226, 176, 126, 0.2); color: var(--accent-gold); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Чувственный Календарь</h1>
        <div class="month-title" id="monthTitle"></div>
        <div class="sync-badge" id="syncBadge">📲 Синхронизация: Локальный режим</div>
    </header>

    <div class="setup-card" id="setupCard">
        <h2>✨ Настройка пары</h2>
        <div class="form-group">
            <label>Общий Код Пары (одинаковый у обоих):</label>
            <input type="text" class="form-control" placeholder="Например: LOVE2026" id="pairCodeInput">
        </div>
        <div class="form-group">
            <label>Ваш профиль в паре:</label>
            <select class="form-control" id="userRoleSelect">
                <option value="p1">Мужчина (Партнер 1)</option>
                <option value="p2">Женщина (Партнер 2)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Основной акцент на месяц:</label>
            <select class="form-control" id="preferenceSelect">
                <option value="balanced">Микс (Полное разнообразие + Классика)</option>
                <option value="female_lead">Женское Доминирование (Она Ведёт)</option>
                <option value="classic">Классика и Нежность</option>
                <option value="kamasutra">Камасутра и Сложные Позы</option>
                <option value="bdsm">BDSM и Контроль</option>
            </select>
        </div>
        <button class="btn-primary" onclick="saveSettings()">Запустить Программу 🔥</button>
    </div>

    <div class="dashboard" id="dashboard" style="display:none;">
        <div class="dash-top">
            <div id="achievement" class="achievement-badge">🏆 Статус: Новички</div>
            <div class="dash-actions">
                <button class="btn-secondary" onclick="openGeneratorModal()">🔮 Генератор Совпадений</button>
                <button class="btn-secondary" onclick="spinRoulette()">🎲 Рулетка</button>
                <button class="btn-secondary" id="favFilterBtn" onclick="toggleFavFilter()">⭐</button>
                <button class="btn-secondary" onclick="resetSettings()">⚙️</button>
            </div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-text">
                <span id="progressText">Прогресс пары: 0 / 30</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
    </div>

    <div class="calendar-grid" id="grid"></div>

    <!-- Модальное окно дня -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <button class="fav-toggle-btn" id="modalFavBtn" onclick="toggleCurrentFav()">☆</button>
            <h3 id="modalTitle" style="color:var(--accent-gold); margin-top:0;"></h3>
            <div id="modalRole" style="font-size:0.85rem; margin-bottom:10px;"></div>
            <div class="modal-img-container">
                <img id="modalImg" src="" alt="Иллюстрация">
            </div>
            <p id="modalTask" style="line-height:1.6; font-size:0.95rem;"></p>
            <div id="modalTip" style="font-style:italic; color:var(--text-sub); font-size:0.85rem; background:rgba(255,255,255,0.03); padding:10px; border-left:3px solid var(--accent-gold);"></div>
            <a id="modalVideo" class="video-link" href="#" target="_blank">🎬 Обучающий материал / гайд</a>
            <button class="btn-primary" style="margin-top:20px;" onclick="toggleComplete()">Отметить пройденным ✓</button>
        </div>
    </div>

    <!-- Модальное окно Генератора Совпадений (Yes/No/Maybe) -->
    <div class="modal-overlay" id="generatorModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeGeneratorModal()">&times;</button>
            <h3 style="color:var(--accent-gold); margin-top:0;">🔮 Генератор Совпадений</h3>
            <p style="font-size:0.85rem; color:var(--text-sub);">Отметьте желания анонимно. Приложение откроет только те практики, где ваши ответы совпадут!</p>
            <div id="surveyContainer" style="max-height: 50vh; overflow-y: auto;"></div>
            <button class="btn-primary" style="margin-top:15px;" onclick="checkMatches()">Найти Совпадения ✨</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://calendar-pair-default-rtdb.europe-west1.firebasedatabase.app"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {}

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        const daysInCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const monthKey = `${currentYear}_${currentMonth}`;

        document.getElementById('monthTitle').innerText = `${monthNames[currentMonth]} ${currentYear} (${daysInCurrentMonth} дней)`;

        const imgPool = [
            "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=800&q=80"
        ];

        const database = {
            female_lead: [
                { id: "fl1", title: "Классическая Наездница", category: "Доминирование", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", task: "Он лежит на спине. Девушка сверху задает глубокий ритм, контролируя скорость и угол фрикций.", tip: "Совет: Вы можете делать паузы на пике его возбуждения.", video: "https://www.youtube.com/results?search_query=cowgirl+position+guide" },
                { id: "fl2", title: "Запрет на Оргазм (Orgasm Denial)", category: "BDSM", lead: "👑 Она — Ведущая | 🗝️ Он — Ведомый", task: "Она доводит его до края разрядки 3 раза и резко останавливает ласки по команде. Финиш только с её разрешения.", tip: "Совет: Используйте прямой зрительный контакт.", video: "https://www.youtube.com/results?search_query=edging+and+denial+guide" }
            ],
            classic: [
                { id: "cl1", title: "Техника CAT (Коитальное Выравнивание)", category: "Классика", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", task: "Миссионерская поза со смещением корпуса вверх. Трение основанием члена о клитор без глубоких толчков.", tip: "Совет: Подложите подушку под крестец.", video: "https://www.youtube.com/results?search_query=coital+alignment+technique" },
                { id: "cl2", title: "Правило 20 Минут Поцелуев", category: "Нежность", lead: "🤝 Оба на равных", task: "20 минут поцелуев и массажа плеч, шеи и бедер. Касаться гениталий до истечения таймера запрещено.", tip: "Совет: Создает огромный голод к контакту.", video: "https://www.youtube.com/results?search_query=foreplay+guide+couples" }
            ],
            kamasutra: [
                { id: "km1", title: "Поза 'Цветок Лотоса'", category: "Камасутра", lead: "🤝 Оба на равных", task: "Мужчина сидит скрестив ноги, Девушка садится сверху. Поза для максимально глубокого душевного контакта.", tip: "Совет: Обнимайте друг друга за шею.", video: "https://www.youtube.com/results?search_query=lotus+pose+couples" }
            ],
            bdsm: [
                { id: "bd1", title: "Шелковая Фиксация", category: "BDSM", lead: "👑 Он — Ведущий | 🌹 Она — Ведомая", task: "Руки зафиксированы над головой шелковым шарфом. Медленные ласки всего тела.", tip: "Совет: Используйте перышко и поцелуи.", video: "https://www.youtube.com/results?search_query=silk+bondage+tutorial" }
            ]
        };

        function getTasksForMonth(category) {
            let pool = (category === 'balanced') 
                ? [...database.classic, ...database.female_lead, ...database.kamasutra, ...database.bdsm]
                : (database[category] || database.classic);

            const result = [];
            for (let day = 1; day <= daysInCurrentMonth; day++) {
                const base = pool[(day - 1) % pool.length];
                result.push({
                    day: day,
                    id: base.id || `item_${day}`,
                    title: `${day < 10 ? '0' + day : day}. ${base.title}`,
                    category: base.category,
                    lead: base.lead,
                    roleClass: base.lead.includes("Она — Ведущая") ? "role-f" : (base.lead.includes("Он — Ведущий") ? "role-m" : "role-both"),
                    img: imgPool[(day - 1) % imgPool.length],
                    task: base.task,
                    tip: base.tip,
                    video: base.video
                });
            }
            return result;
        }

        let pairCode = localStorage.getItem('pairCode') || '';
        let userRole = localStorage.getItem('userRole') || 'p1';
        let selectedCategory = localStorage.getItem('userCat') || 'balanced';
        let monthTasks = getTasksForMonth(selectedCategory);
        let completedDays = JSON.parse(localStorage.getItem(`completed_${monthKey}`) || '[]');
        let favDays = JSON.parse(localStorage.getItem(`favDays`) || '[]');
        let currentDay = null;
        let onlyFavFilter = false;

        if (pairCode) {
            document.getElementById('pairCodeInput').value = pairCode;
            document.getElementById('userRoleSelect').value = userRole;
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            initSync();
            renderGrid();
        }

        function saveSettings() {
            pairCode = document.getElementById('pairCodeInput').value.trim().toUpperCase() || 'PAIR123';
            userRole = document.getElementById('userRoleSelect').value;
            selectedCategory = document.getElementById('preferenceSelect').value;
            
            localStorage.setItem('pairCode', pairCode);
            localStorage.setItem('userRole', userRole);
            localStorage.setItem('userCat', selectedCategory);
            
            monthTasks = getTasksForMonth(selectedCategory);
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            initSync();
            renderGrid();
        }

        function resetSettings() {
            document.getElementById('setupCard').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function initSync() {
            if (!db || !pairCode) return;
            document.getElementById('syncBadge').innerText = `🟢 Синхронно: Код [ ${pairCode} ] (${userRole === 'p1' ? 'Он' : 'Она'})`;
            db.ref(`pairs/${pairCode}/${monthKey}`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    completedDays = data;
                    localStorage.setItem(`completed_${monthKey}`, JSON.stringify(completedDays));
                    renderGrid();
                }
            });
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            const tasksToRender = onlyFavFilter 
                ? monthTasks.filter(t => favDays.includes(t.day)) 
                : monthTasks;

            tasksToRender.forEach(task => {
                const isCompleted = completedDays.includes(task.day);
                const isFav = favDays.includes(task.day);
                const card = document.createElement('div');
                card.id = `card-day-${task.day}`;
                card.className = `day-card ${isCompleted ? 'completed' : ''} ${isFav ? 'fav' : ''}`;
                card.innerHTML = `
                    <div class="day-number">${task.day < 10 ? '0' + task.day : task.day}</div>
                    <div class="day-category">${task.category}</div>
                    <div class="day-role ${task.roleClass}">${task.lead.split(' ')[1]}</div>
                `;
                card.onclick = () => openModal(task);
                grid.appendChild(card);
            });
            updateProgress();
        }

        function openModal(task) {
            currentDay = task.day;
            document.getElementById('modalTitle').innerText = task.title;
            document.getElementById('modalRole').innerText = task.lead;
            document.getElementById('modalImg').src = task.img;
            document.getElementById('modalTask').innerText = task.task;
            document.getElementById('modalTip').innerText = task.tip;
            document.getElementById('modalVideo').href = task.video;
            
            const isFav = favDays.includes(task.day);
            document.getElementById('modalFavBtn').innerText = isFav ? '⭐' : '☆';
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function toggleComplete() {
            if (completedDays.includes(currentDay)) {
                completedDays = completedDays.filter(d => d !== currentDay);
            } else {
                completedDays.push(currentDay);
            }
            localStorage.setItem(`completed_${monthKey}`, JSON.stringify(completedDays));
            if (db && pairCode) db.ref(`pairs/${pairCode}/${monthKey}`).set(completedDays);
            renderGrid();
            closeModal();
        }

        function toggleCurrentFav() {
            if (favDays.includes(currentDay)) {
                favDays = favDays.filter(d => d !== currentDay);
            } else {
                favDays.push(currentDay);
            }
            localStorage.setItem('favDays', JSON.stringify(favDays));
            document.getElementById('modalFavBtn').innerText = favDays.includes(currentDay) ? '⭐' : '☆';
            renderGrid();
        }

        function toggleFavFilter() {
            onlyFavFilter = !onlyFavFilter;
            const btn = document.getElementById('favFilterBtn');
            btn.style.background = onlyFavFilter ? 'var(--accent-gold)' : 'rgba(226, 176, 126, 0.15)';
            btn.style.color = onlyFavFilter ? '#0f0d13' : 'var(--accent-gold)';
            renderGrid();
        }

        function spinRoulette() {
            const available = monthTasks.filter(t => !completedDays.includes(t.day));
            if (available.length === 0) {
                alert("Все дни пройдены!");
                return;
            }
            let count = 0;
            const interval = setInterval(() => {
                const randomTask = available[Math.floor(Math.random() * available.length)];
                document.querySelectorAll('.day-card').forEach(c => c.classList.remove('highlight'));
                const el = document.getElementById(`card-day-${randomTask.day}`);
                if (el) el.classList.add('highlight');
                count++;
                if (count >= 12) {
                    clearInterval(interval);
                    setTimeout(() => openModal(randomTask), 300);
                }
            }, 100);
        }

        function updateProgress() {
            const count = completedDays.length;
            const percent = Math.round((count / daysInCurrentMonth) * 100);
            
            document.getElementById('progressText').innerText = `Прогресс пары: ${count} / ${daysInCurrentMonth} дней`;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressFill').style.width = `${percent}%`;

            let badge = "🏆 Статус: Новички";
            if (count >= 25) badge = "👑 Статус: Мастера Интимности";
            else if (count >= 18) badge = "🔥 Статус: Огненный Союз";
            else if (count >= 10) badge = "🧘‍♀️ Статус: Исследователи";
            else if (count >= 3) badge = "✨ Статус: Первый Шаг";

            document.getElementById('achievement').innerText = badge;
        }

        /* ЛОГИКА ГЕНЕРАТОРА СОВПАДЕНИЙ (YES/NO/MAYBE) */
        let myVotes = {};

        function openGeneratorModal() {
            const container = document.getElementById('surveyContainer');
            container.innerHTML = '';
            
            monthTasks.forEach(task => {
                const div = document.createElement('div');
                div.style.marginBottom = "15px";
                div.style.background = "#120f1a";
                div.style.padding = "10px";
                div.style.borderRadius = "10px";
                div.innerHTML = `
                    <div style="font-size:0.85rem; font-weight:bold; color:var(--accent-gold);">${task.title}</div>
                    <div class="vote-options">
                        <button class="btn-vote" onclick="setVote('${task.id}', 'yes', this)">Да 🔥</button>
                        <button class="btn-vote" onclick="setVote('${task.id}', 'maybe', this)">Возможно 💭</button>
                        <button class="btn-vote" onclick="setVote('${task.id}', 'no', this)">Нет ❌</button>
                    </div>
                `;
                container.appendChild(div);
            });
            
            document.getElementById('generatorModal').style.display = 'flex';
        }

        function closeGeneratorModal() { document.getElementById('generatorModal').style.display = 'none'; }

        function setVote(taskId, voteVal, btnEl) {
            myVotes[taskId] = voteVal;
            const parent = btnEl.parentElement;
            parent.querySelectorAll('.btn-vote').forEach(b => b.classList.remove('selected'));
            btnEl.classList.add('selected');
        }

        function checkMatches() {
            if (!db || !pairCode) {
                alert("Для работы генератора совпадений включите код пары!");
                return;
            }

            // Сохраняем свои голоса в Firebase
            db.ref(`votes/${pairCode}/${userRole}`).set(myVotes);

            // Получаем голоса партнера
            const partnerRole = userRole === 'p1' ? 'p2' : 'p1';
            db.ref(`votes/${pairCode}/${partnerRole}`).once('value', (snapshot) => {
                const partnerVotes = snapshot.val() || {};
                
                let matchesCount = 0;
                monthTasks.forEach(task => {
                    const myV = myVotes[task.id];
                    const pV = partnerVotes[task.id];
                    
                    // Совпадение: оба "yes" или ("yes" + "maybe")
                    if ((myV === 'yes' && pV === 'yes') || (myV === 'yes' && pV === 'maybe') || (myV === 'maybe' && pV === 'yes')) {
                        if (!favDays.includes(task.day)) favDays.push(task.day);
                        matchesCount++;
                    }
                });

                localStorage.setItem('favDays', JSON.stringify(favDays));
                renderGrid();
                closeGeneratorModal();

                if (matchesCount > 0) {
                    alert(`🔥 Найдено совпадений: ${matchesCount}! Они автоматически добавлены в вашу папку Избранного ⭐`);
                } else {
                    alert("Партнер еще не прошел опрос или нет полных совпадений. Данные обновятся, когда партнер закончит!");
                }
            });
        }
    </script>
</body>
</html>
